name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag matches package version
        run: node scripts/check-release-consistency.mjs
      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../turbowarp-tmpose.zip .
      - name: Create npm package archive
        run: npm pack --ignore-scripts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tmpose.js
            dist/composition.js
            dist/runtime.js
            dist/THIRD_PARTY_NOTICES.md
            kubohiroya-turbowarp-tmpose-*.tgz
            turbowarp-tmpose.zip
